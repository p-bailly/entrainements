<title>Entraînement Évaluation variations d'une fonction</title>
<!--
  Entraînement auto-corrigé à l'évaluation du chapitre 13 (Variations d'une fonction) - Seconde.
  Une seule partie, douze questions, sans automatismes (demande du professeur), rangées par
  difficulté croissante, en trois niveaux :
    1 à 3  : lectures directes et cours : sens de variation lu sur une courbe (capacité 1),
             maximum et minimum lus dans un tableau (capacité 3), variations des fonctions de
             référence (carré, inverse, racine carrée, cube ; affine en variante) ;
    4 à 8  : méthodes en deux ou trois étapes : de la courbe au tableau de variations
             (capacité 1), du tableau à la courbe, parmi quatre courbes (capacité 2),
             extremums sur un sous-intervalle, atteints à une borne (capacité 3), comparer
             deux images dans un intervalle où la fonction est monotone (capacité 2), comparer
             sans calculer (capacité 4) ;
    9 à 12 : plusieurs étapes et pièges : encadrer (capacité 4), peut-on comparer deux images
             prises dans deux intervalles différents (on ne peut pas conclure ; variante : on
             peut, par une chaîne d'inégalités), optimisation (enclos adossé à un mur :
             tableau de valeurs, puis pas de 1 autour du maximum ; capacité 5), lecture de la
             fonction Python de balayage du problème.
  Sources : définitions, méthodes, démonstrations et capacités 1 à 5 du cours, activités 1 (la
  randonnée), 2 (l'enclos) et 3 (carrés et inverses), fiche d'exercices (exercices 1 à 4),
  problème « la plus grande boîte » (balayage en Python), évaluation (sujets A et B, exercices
  2 à 4 ; son QCM d'automatismes n'est pas repris) et exercices du manuel cités dans le plan
  (17 et 20 p. 256 ; 29, et 32 et 33 des plus rapides, p. 257 ; 35 p. 258 ; 53 p. 259 ; 68
  p. 261 ; 75 p. 262 ; « Faire le point » p. 263, questions 1 à 4 et 9 à 14 ; 79 p. 265 ; 96
  p. 268, des plus rapides).
  Mêmes types de questions que dans le cours, la fiche et l'évaluation, avec d'autres valeurs,
  sans calculatrice, comme à l'évaluation : ni conjecture à la calculatrice (capacité 1,
  question 3 ; exercice 49 p. 259), ni longueur d'une portion de courbe (fiche, exercice 5 ;
  exercice 91 p. 267). Comparaisons tirées d'un tableau écrites avec des inégalités strictes,
  comme dans les corrections du cours.
  Distracteurs : erreurs types (croissante et décroissante confondues, intervalles lus sur
  l'axe des ordonnées, intervalles où la fonction est positive, flèches inversées, bornes
  oubliées, abscisses et images confondues, courbe qui passe par les bons points sans avoir
  les bonnes variations, ordre gardé là où la fonction décroît, « on ne peut pas conclure »
  répondu à tort ou oublié, extremum pris hors de l'intervalle, borne oubliée, fonction
  inverse décroissante sur la réunion de ses deux intervalles, cube traité comme un carré,
  0,49 lu plus grand que 0,5, racine carrée prise pour une moitié, plus grande valeur d'un
  tableau prise pour le maximum, enclos cru carré, image maximale renvoyée à la place de x,
  dernier maximum gardé malgré le test strict du programme).
  Figures : repere du gabarit. Les courbes passent par des noeuds entiers, reliés par
  l'interpolation monotone de lisse (reprise du chapitre 6, celle des arcs de Bézier des
  figures du cours) : extremums aux noeuds, toutes les lectures tombent sur le quadrillage.
  Écrits avant QUIZ : tableauVar (tableau de variations comme ceux du cours, tkz-tab),
  tableauValeurs (tableau de valeurs), petiteCourbe (courbe d'un choix de réponse),
  programmePython (repris du chapitre 8).
  Chaque question a une variante (mêmes notions, autres valeurs) pour la reprise des
  questions manquées.

  Page générée par tools/entrainement.py : ne pas la modifier ici. Questions :
  entrainement-13-variations-fonctions-questions.js (même dossier) ; moteur et mise en page :
  Commun aux cours/entrainement/gabarit.html (format des questions en tête).
  Publiée pour les élèves : https://p-bailly.github.io/entrainements/seconde/13-variations-fonctions.html
  (python tools/entrainement.py --publier). Vue corrigé : ?corrige à la fin de l'adresse.
-->

<main class="feuille">
  <header>
    <p class="retour"><a href="https://p-bailly.github.io/entrainements/">← Tous les entraînements</a></p>
    <div class="entete"><span>Seconde</span><span>M. Bailly</span><span>Chapitre 13 · Variations d'une fonction</span></div>
    <h1>Entraînement Évaluation variations d'une fonction</h1>
    <p class="consigne">Douze questions sur les variations d'une fonction. Une seule réponse est exacte à chaque fois. À faire sans calculatrice.</p>
    <div class="filet" role="presentation"></div>
  </header>
  <nav class="progression" id="progression" aria-label="Grilles de réponses"></nav>
  <section id="quiz" aria-live="polite"></section>

    <p><button type="button" id="reinitialiser">Recommencer depuis le début</button></p>
  </footer>
</main>
<script>
(function () {
'use strict';
const r = String.raw;

/* ---------- Figures (SVG généré) ---------- */
const arrondi = x => Math.round(x * 10) / 10;
const fr = x => String(x).replace('.', ',');
const moins = n => String(n).replace('-', '−');
function fleche(x, y, sens) {
  return sens === 'droite'
    ? `<path class="fleche" d="M${x} ${y} l-7 -3.5 v7 z"/>`
    : `<path class="fleche" d="M${x} ${y} l-3.5 7 h7 z"/>`;
}
// Repère orthonormé quadrillé et gradué de 1 en 1. o = {xmin, xmax, ymin, ymax, label, echelle} et, au choix :
//   courbes  : [{f: x => ..., classe, x1, x2}]        classe = c-rouge (défaut), c-bleu, c-noir, c-violet
//   noms     : [{x, y, texte, indice, apres, classe, ancre}]   nom d'une courbe, dans sa couleur
//   lectures : [[[x, y], [x, y], ...], ...]            lignes de lecture en tirets verts, flèche au bout
//   textes   : [{x, y, texte, ancre}]                  annotations vertes des lectures (+1, +3...)
//   points   : [{x, y, classe}]
//   surligne : {x1, x2}                                partie de l'axe des abscisses surlignée en orange (null = bord du repère)
let numeroFigure = 0;
function repere(o) {
  const u = 26, m = 17;
  const W = (o.xmax - o.xmin) * u + 2 * m, H = (o.ymax - o.ymin) * u + 2 * m;
  const X = x => arrondi(m + (x - o.xmin) * u), Y = y => arrondi(m + (o.ymax - y) * u);
  const cadre = 'cadre-' + (++numeroFigure);
  const xfin = X(o.xmax) + 12, yhaut = Y(o.ymax) - 12;
  let s = `<svg class="fig" viewBox="0 0 ${W} ${H}" style="max-width:${Math.round(W * (o.echelle || 1.3))}px" role="img" aria-label="${o.label}">`;
  s += `<defs><clipPath id="${cadre}"><rect x="${X(o.xmin)}" y="${Y(o.ymax)}" width="${(o.xmax - o.xmin) * u}" height="${(o.ymax - o.ymin) * u}"/></clipPath></defs>`;
  for (let x = o.xmin; x <= o.xmax; x++) s += `<line class="grille" x1="${X(x)}" y1="${Y(o.ymin)}" x2="${X(x)}" y2="${Y(o.ymax)}"/>`;
  for (let y = o.ymin; y <= o.ymax; y++) s += `<line class="grille" x1="${X(o.xmin)}" y1="${Y(y)}" x2="${X(o.xmax)}" y2="${Y(y)}"/>`;
  if (o.surligne) {
    const x1 = o.surligne.x1 === null ? o.xmin : o.surligne.x1, x2 = o.surligne.x2 === null ? o.xmax : o.surligne.x2;
    s += `<line class="surligne" x1="${X(x1)}" y1="${Y(0)}" x2="${X(x2)}" y2="${Y(0)}"/>`;
  }
  s += `<line class="axe" x1="${X(o.xmin)}" y1="${Y(0)}" x2="${xfin}" y2="${Y(0)}"/>${fleche(xfin, Y(0), 'droite')}`;
  s += `<line class="axe" x1="${X(0)}" y1="${Y(o.ymin)}" x2="${X(0)}" y2="${yhaut}"/>${fleche(X(0), yhaut, 'haut')}`;
  (o.courbes || []).forEach(c => {
    const x1 = c.x1 === undefined ? o.xmin : c.x1, x2 = c.x2 === undefined ? o.xmax : c.x2, n = 80;
    let d = '';
    for (let k = 0; k <= n; k++) { const x = x1 + (x2 - x1) * k / n; d += (k ? ' L' : 'M') + X(x) + ' ' + Y(c.f(x)); }
    s += `<path class="courbe ${c.classe || 'c-rouge'}" clip-path="url(#${cadre})" d="${d}"/>`;
  });
  (o.lectures || []).forEach(pts => {
    const P = pts.map(p => [X(p[0]), Y(p[1])]);
    const a = P[P.length - 2], b = P[P.length - 1];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    s += `<polyline class="lecture" points="${P.map(p => p.join(',')).join(' ')}"/>`;
    s += `<path class="pointe" d="M${b[0]} ${b[1]} L${arrondi(b[0] - 7 * ux + 3.2 * uy)} ${arrondi(b[1] - 7 * uy - 3.2 * ux)} L${arrondi(b[0] - 7 * ux - 3.2 * uy)} ${arrondi(b[1] - 7 * uy + 3.2 * ux)} z"/>`;
  });
  // Graduations sur fond papier, par-dessus les courbes et les lectures : elles restent lisibles.
  for (let x = o.xmin; x <= o.xmax; x++) if (x !== 0) s += `<text class="tick" x="${X(x)}" y="${Y(0) + 13}" text-anchor="middle">${moins(x)}</text>`;
  for (let y = o.ymin; y <= o.ymax; y++) if (y !== 0) s += `<text class="tick" x="${X(0) - 5}" y="${Y(y) + 3.5}" text-anchor="end">${moins(y)}</text>`;
  s += `<text class="tick" x="${X(0) - 5}" y="${Y(0) + 13}" text-anchor="end">0</text>`;
  (o.points || []).forEach(p => { s += `<circle class="pt ${p.classe || 'c-rouge'}" cx="${X(p.x)}" cy="${Y(p.y)}" r="3.3"/>`; });
  (o.textes || []).forEach(t => { s += `<text class="note" x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.ancre || 'middle'}">${t.texte}</text>`; });
  (o.noms || []).forEach(n => {
    const indice = n.indice ? `<tspan dy="3" font-size="9.5">${n.indice}</tspan>` + (n.apres ? `<tspan dy="-3">${n.apres}</tspan>` : '') : '';
    s += `<text class="lab ${n.classe || 'c-rouge'}" x="${X(n.x)}" y="${Y(n.y)}" text-anchor="${n.ancre || 'start'}">${n.texte}${indice}</text>`;
  });
  return s + '</svg>';
}
// Feuille de calcul (question sur le tableur) : lignes = [[A, B], ...] à partir de la ligne 1 ;
// la cellule '#sel' est la cellule sélectionnée, laissée vide.
function tableur(lignes, label) {
  const cellule = c => c === '#sel' ? '<td class="sel"></td>' : `<td>${c}</td>`;
  return `<table class="tableur" aria-label="${label}"><tr><th></th><th>A</th><th>B</th></tr>`
    + lignes.map((l, k) => `<tr><th>${k + 1}</th>${cellule(l[0])}${cellule(l[1])}</tr>`).join('')
    + '</table>';
}

// Calcul en colonne, comme l'environnement calcul des PDF : une étape par ligne, alignées sur le
// signe placé après & (formules écrites sans les dollars). Le résultat s'encadre avec \resultat{...}.
//   calcul(r`A & = x - 4(3x + 2)`, r`& = x - 12x - 8`, r`& = \resultat{-11x - 8}`)
function calcul(...lignes) {
  return '<div class="calcul">' + lignes.map(l => {
    const k = l.indexOf('&');
    const gauche = k < 0 ? '' : l.slice(0, k).trim(), droite = (k < 0 ? l : l.slice(k + 1)).trim();
    return '<span class="g">' + (gauche ? '$' + gauche + '$' : '') + '</span><span class="d">$' + droite + '$</span>';
  }).join('') + '</div>';
}

// Courbe lisse pour repere (reprise du chapitre 6) : fonction qui passe par les noeuds
// (x0 ; ys[0]), (x0 + 1 ; ys[1]), ... et les relie par l'interpolation cubique monotone (PCHIP),
// la même que les arcs de Bézier des figures du cours : entre deux noeuds, la courbe ne dépasse
// ni l'un ni l'autre (extremums aux noeuds), et toutes les lectures tombent sur le quadrillage.
function lisse(x0, ys) {
  const n = ys.length, d = [], m = [];
  for (let k = 0; k < n - 1; k++) d.push(ys[k + 1] - ys[k]);
  for (let k = 1; k < n - 1; k++) m[k] = d[k - 1] * d[k] <= 0 ? 0 : 2 / (1 / d[k - 1] + 1 / d[k]);
  // Pente aux extrémités : formule à trois points, bornée pour que la courbe reste monotone.
  const bout = (d0, d1) => {
    let t = (3 * d0 - d1) / 2;
    if (t * d0 <= 0) t = 0;
    else if (d0 * d1 < 0 && Math.abs(t) > Math.abs(3 * d0)) t = 3 * d0;
    return t;
  };
  m[0] = bout(d[0], d[1]);
  m[n - 1] = bout(d[n - 2], d[n - 3]);
  return x => {
    const k = Math.max(0, Math.min(n - 2, Math.floor(x - x0)));
    const t = x - x0 - k, t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * ys[k] + (t3 - 2 * t2 + t) * m[k]
      + (-2 * t3 + 3 * t2) * ys[k + 1] + (t3 - t2) * m[k + 1];
  };
}

// Tableau de variations comme ceux du cours (tkz-tab) : première ligne, les valeurs de x ;
// seconde ligne, les images, écrites en haut ou en bas et reliées par des flèches qui montent ou
// qui descendent. tableauVar(nom, xs, ys, pos) : nom de la fonction ('f'), valeurs de x et
// images (nombres) ; pos (facultatif) : une lettre par image, 'h' en haut, 'b' en bas, pour
// dessiner un tableau faux ; sans pos, la place de chaque image se déduit des images.
// Écrit par concaténation de chaînes, sans gabarit de chaîne.
function tableauVar(nom, xs, ys, pos) {
  const n = xs.length, c = 46, p = 24, e = 62, h1 = 28, h2 = 62;
  const W = c + 2 * p + e * (n - 1), H = h1 + h2 + 2, haut = 1 + h1;
  const nb = v => String(v).replace('.', ',').replace('-', '−');
  const r1 = v => Math.round(v * 10) / 10;
  const place = pos || ys.map((y, k) => (k > 0 ? y > ys[k - 1] : y > ys[1]) ? 'h' : 'b').join('');
  const X = k => c + p + e * k;
  const Y = k => place[k] === 'h' ? haut + 16 : H - 9;     // ligne de base de l'image
  const A = k => place[k] === 'h' ? haut + 22 : H - 25;    // départ ou arrivée d'une flèche
  const texte = (x, y, t, cls, taille) => '<text class="' + cls + '" x="' + x + '" y="' + y
    + '" text-anchor="middle" style="font-size:' + taille + 'px">' + t + '</text>';
  const trait = (x1, y1, x2, y2) => '<line class="axe" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"/>';
  let s = '';
  const sens = [];
  for (let k = 0; k < n; k++) s += texte(X(k), 20, nb(xs[k]), 'tick', 13) + texte(X(k), Y(k), nb(ys[k]), 'tick', 13);
  for (let k = 0; k < n - 1; k++) {
    const x1 = X(k) + 13, y1 = A(k), x2 = X(k + 1) - 13, y2 = A(k + 1);
    const L = Math.hypot(x2 - x1, y2 - y1), ux = (x2 - x1) / L, uy = (y2 - y1) / L;
    s += trait(x1, y1, r1(x2 - 6 * ux), r1(y2 - 6 * uy))
      + '<path class="fleche" d="M' + x2 + ' ' + y2 + ' L' + r1(x2 - 7 * ux + 3.2 * uy) + ' ' + r1(y2 - 7 * uy - 3.2 * ux)
      + ' L' + r1(x2 - 7 * ux - 3.2 * uy) + ' ' + r1(y2 - 7 * uy + 3.2 * ux) + ' z"/>';
    sens.push((place[k + 1] === 'h' ? 'croissante' : 'décroissante') + ' sur [' + nb(xs[k]) + ' ; ' + nb(xs[k + 1])
      + '], de ' + nb(ys[k]) + ' à ' + nb(ys[k + 1]));
  }
  return '<svg class="fig" viewBox="0 0 ' + W + ' ' + H + '" style="max-width:' + Math.round(W * 1.25)
    + 'px" role="img" aria-label="Tableau de variations de ' + nom + ' : ' + sens.join(' ; ') + '">'
    + '<rect class="axe" x="1" y="1" width="' + (W - 2) + '" height="' + (H - 2) + '"/>'
    + trait(c, 1, c, H - 1) + trait(1, haut, W - 1, haut)
    + texte(c / 2, 20, 'x', 'lab c-noir', 14)
    + '<text class="lab c-noir" x="' + (c / 2) + '" y="' + (haut + h2 / 2 + 5) + '" text-anchor="middle" style="font-size:14px">'
    + nom + '<tspan font-style="normal">(</tspan>x<tspan font-style="normal">)</tspan></text>'
    + s + '</svg>';
}

// Tableau de valeurs, comme dans le cours : ligne de x, puis ligne des images (nombres en
// formules). Défile horizontalement sur un écran étroit.
function tableauValeurs(nomx, nomy, xs, ys, label) {
  const cel = ' style="border:1px solid var(--encre); padding:2px 8px; text-align:center; font-weight:400"';
  const ligne = (tete, vals) => '<tr><th' + cel + '>$' + tete + '$</th>'
    + vals.map(v => '<td' + cel + '>$' + v + '$</td>').join('') + '</tr>';
  return '<div style="overflow-x:auto; margin:10px 0 12px"><table aria-label="' + label
    + '" style="border-collapse:collapse; margin:0 auto">' + ligne(nomx, xs) + ligne(nomy, ys) + '</table></div>';
}

// Courbe d'un choix de réponse (question 5) : petit repère, extrémités marquées d'un point rouge.
// L'enveloppe (span en bloc, attribut data-courbe propre à chaque courbe) distingue les quatre
// choix, même pour le contrôle de structure, qui remplace chaque repère par la même figure vide.
function petiteCourbe(xmin, xmax, ymin, ymax, f, bouts, label) {
  return '<span style="display:block" data-courbe="' + label + '">'
    + repere({ xmin: xmin, xmax: xmax, ymin: ymin, ymax: ymax, echelle: 1, courbes: [{ f: f }],
      points: bouts.map(b => ({ x: b[0], y: b[1] })), label: label }) + '</span>';
}

// Programme Python de la question 12, présenté comme dans la fiche d'exercices du chapitre 8 :
// police à chasse fixe, fond gris clair, filet à gauche. Les signes <, > et & du code sont
// échappés ici. Écrit par concaténation de chaînes, sans gabarit de chaîne.
function programmePython(lignes) {
  const code = lignes.map(l => l.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')).join('\n');
  return '<pre style="margin:.5em 0 .8em 1.2em; padding:.45em .9em; background:var(--case);'
    + ' border-left:2px solid var(--filet); font-family:var(--mono); font-size:.85em;'
    + ' line-height:1.45; overflow-x:auto">' + code + '</pre>';
}

/* ---------- Conversion des formules ($...$, mini-LaTeX) en HTML ---------- */
const SYM = {
  times: '×', cdot: '·', dots: '…', ldots: '…', cdots: '…', ne: '≠', neq: '≠', le: '≤', leq: '≤',
  ge: '≥', geq: '≥', approx: '≈', infty: '∞', forall: '∀', in: '∈', N: 'ℕ', R: 'ℝ', Z: 'ℤ',
  pm: '±', Delta: 'Δ', sum: 'Σ', pi: 'π', alpha: 'α', mapsto: '↦', to: '→', iff: '⇔',
  Longleftrightarrow: '⇔', Leftrightarrow: '⇔', Rightarrow: '⇒', implies: '⇒',
  quad: ' ', qquad: '  ', displaystyle: '', left: '', right: ''
};
const SYM1 = { ',': ' ', ';': ' ', ' ': ' ', '{': '{', '}': '}', '%': '%', '_': '_', '&': '&amp;', '$': '$', '\\': '<br>' };
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function math(s) {
  let i = 0;
  const skip = () => { while (i < s.length && s[i] === ' ') i++; };
  function raw() {            // contenu brut d'un {groupe}, sans mise en italique
    skip();
    if (s[i] !== '{') return esc(s[i++] || '');
    let prof = 0, out = '';
    for (; i < s.length; i++) {
      const c = s[i];
      if (c === '{') { prof++; if (prof === 1) continue; }
      if (c === '}') { prof--; if (prof === 0) { i++; break; } }
      out += c;
    }
    return esc(out);
  }
  function group() { i++; let out = ''; while (i < s.length && s[i] !== '}') out += atom(); i++; return out; }
  function arg() { skip(); if (s[i] === '{') return group(); return atom(); }
  const frac = (a, b) => `<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`;
  function atom() {
    if (i >= s.length) return '';
    const c = s[i];
    if (c === '{') return group();
    if (c === '}') { i++; return ''; }
    if (c === '\\') {
      const n = s[i + 1];
      if (n === undefined) { i++; return ''; }
      if (!/[a-zA-Z]/.test(n)) { i += 2; return SYM1[n] !== undefined ? SYM1[n] : esc(n); }
      let j = i + 1;
      while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
      const nom = s.slice(i + 1, j); i = j;
      if (nom === 'frac' || nom === 'dfrac' || nom === 'tfrac') { const a = arg(); const b = arg(); return frac(a, b); }
      if (nom === 'mathrm' || nom === 'text') return `<span class="rm">${raw()}</span>`;
      if (nom === 'textbf') return `<b class="rm">${raw()}</b>`;
      if (nom === 'mathscr') return `<i>${raw()}</i>`;
      if (nom === 'resultat') return `<span class="resultat">${arg()}</span>`;
      if (nom === 'mul') return `<span class="mul">${arg()}</span>`;
      if (nom === 'op') return `<span class="op">${arg()}</span>`;
      if (nom === 'sqrt') return `<span class="sqrt">√<span class="rad">${arg()}</span></span>`;
      return SYM[nom] !== undefined ? SYM[nom] : esc('\\' + nom);
    }
    if (c === '_' || c === '^') { i++; const a = arg(); return c === '_' ? `<sub>${a}</sub>` : `<sup>${a}</sup>`; }
    i++;
    if (/[a-zA-Z]/.test(c)) return `<i>${c}</i>`;
    if (c === '-') return '−';
    if (c === '*') return '×';
    if (c === "'") return '<span class="prime">′</span>';
    return esc(c);
  }
  let out = '';
  while (i < s.length) out += atom();
  return out;
}
// Une formule : KaTeX s'il est chargé, sinon (pas encore là, hors ligne, CDN filtré, commande qu'il
// refuse) le mini-LaTeX, qui garde la source dans data-tex pour que katexPret() la recompose.
// (## : signe # d'une couleur dans une macro, # seul désignant un argument)
const MACROS = { '\\mul': '\\textcolor{##9C27B0}{#1}', '\\op': '\\textcolor{##CE2029}{#1}', '\\resultat': '\\boxed{#1}' };
function katexDispo() {
  const feuille = document.getElementById('katex-css');
  return !!window.katex && !!feuille && feuille.media === 'all';
}
function katexHTML(f) {
  try { return katex.renderToString(f, { macros: Object.assign({}, MACROS), throwOnError: true, strict: false }); }
  catch (e) { return null; }
}
function formule(f) {
  const k = katexDispo() ? katexHTML(f) : null;
  return k || `<span class="m${f.length > 42 ? ' m-long' : ''}" data-tex="${esc(f).replace(/"/g, '&quot;')}">${math(f)}</span>`;
}
window.katexPret = function () {
  if (!katexDispo()) return;
  document.querySelectorAll('.m[data-tex]').forEach(e => {
    const k = katexHTML(e.dataset.tex);
    if (k) e.outerHTML = k;
  });
};
function tex(src) {
  return String(src).split(/(\$[^$]*\$)/).map(p =>
    (p.length >= 2 && p[0] === '$' && p[p.length - 1] === '$') ? formule(p.slice(1, -1)) : p
  ).join('');
}

const MODE_CORRIGE = /(\?|&|#)corrige/.test(location.search + location.hash);
// La question i dans sa variante : les champs que la variante ne donne pas viennent de la question.
const variante = i => Object.assign({}, QUIZ.questions[i], QUIZ.questions[i].variante);

function melange(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ordreDe = q => q.type !== 'qcm' ? null : q.fixe ? q.choix.map((_, k) => k) : melange(q.choix.map((_, k) => k));
// reprise : null, ou la reprise des questions manquées { rangs (questions d'origine), ordre, reponses, courant }.
function nouvelEtat() {
  return {
    signature: SIGNATURE,
    ordre: QUIZ.questions.map(ordreDe),
    reponses: Array(N).fill(null),
    courant: 0,
    reprise: null
  };
}
function repriseValide(R) {
  return !!R && Array.isArray(R.rangs) && R.rangs.length > 0 && Array.isArray(R.ordre) && Array.isArray(R.reponses)
    && R.ordre.length === R.rangs.length && R.reponses.length === R.rangs.length
    && R.rangs.every(i => QUIZ.questions[i] && QUIZ.questions[i].variante);
}
function charger() {
  try {
    const s = JSON.parse(localStorage.getItem(CLE));
    if (s && s.signature === SIGNATURE && Array.isArray(s.reponses) && s.reponses.length === N && Array.isArray(s.ordre)) {
      s.courant = Math.min(Math.max(0, s.courant | 0), N);
      if (repriseValide(s.reprise)) s.reprise.courant = Math.min(Math.max(0, s.reprise.courant | 0), s.reprise.rangs.length);
      else s.reprise = null;
      return s;
    }
  } catch (e) { /* stockage indisponible : on repart de zéro */ }
  return null;
}
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* sans importance */ } }

let etat = charger() || nouvelEtat();
let selection = null;

const $ = sel => document.querySelector(sel);
const zoneProg = $('#progression');
const zoneQuiz = $('#quiz');
const motion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
const nomPartie = p => `Partie ${p + 1} · ${QUIZ.parties[p]}`;
// Une seule partie : aucun nom de partie n'est affiché (grille, question, corrigé, note).
const UNE_PARTIE = QUIZ.parties.length === 1;
const questionsDe = p => QUIZ.questions.map((q, i) => q.partie === p ? i : -1).filter(i => i >= 0);

/* ---------- Affichage ---------- */
// Explication : un texte, ou une liste de blocs (paragraphes, calculs en colonne, figures).
function explicationHTML(q) {
  const blocs = Array.isArray(q.explication) ? q.explication : [q.explication];
  return blocs.map(b => /^<(div|svg)\b/.test(b) ? tex(b) : '<p>' + tex(b) + '</p>').join('');
}

function reponseTexte(q, choix) {
  if (q.type === 'vf') return choix ? 'Vrai' : 'Faux';
  return '« ' + tex(q.choix[choix]) + ' »';
}

// Tour en cours : le premier passage (les questions du fichier), ou la reprise des questions
// manquées (leurs variantes). Chacun a ses réponses, l'ordre de ses choix et sa question courante k ;
// le numéro affiché est toujours celui de la question d'origine.
function tourCourant() {
  const R = etat.reprise;
  if (R && R.courant < R.rangs.length)
    return { reprise: true, etat: R, total: R.rangs.length, question: k => variante(R.rangs[k]), numero: k => R.rangs[k] + 1 };
  return { reprise: false, etat: etat, total: N, question: k => QUIZ.questions[k], numero: k => k + 1 };
}

// Une grille de réponses. items = [{cle, numero, rep}] ; attr = data-q (premier passage) ou data-r (reprise).
function grille(nom, items, courant, attr) {
  const faites = items.filter(it => it.rep).length;
  let nums = '', marques = '';
  items.forEach(it => {
    const ici = it.cle === courant;
    nums += `<td class="${ici ? 'ici' : ''}"><button type="button" class="aller" ${attr}="${it.cle}" aria-label="Aller à la question ${it.numero}">${it.numero}</button></td>`;
    marques += it.rep
      ? `<td class="${it.rep.ok ? 'juste' : 'erreur'}${ici ? ' courant' : ''}" ${attr}="${it.cle}"><span class="marque ${it.rep.ok ? 'coche' : 'croix'}" aria-hidden="true"></span></td>`
      : `<td class="${ici ? 'courant' : ''}" ${attr}="${it.cle}"></td>`;
  });
  return `<div class="bloc-grille">${nom ? `<p class="nom-partie">${nom}</p>` : ''}
    <table class="grille-reponses" aria-label="${nom || 'Réponses'} : ${faites} question${faites > 1 ? 's' : ''} sur ${items.length} traitée${faites > 1 ? 's' : ''}"><tr>${nums}</tr><tr>${marques}</tr></table></div>`;
}

function rendreProgression() {
  if (MODE_CORRIGE) { zoneProg.hidden = true; return; }
  const T = tourCourant(), R = etat.reprise;
  zoneProg.innerHTML = T.reprise
    ? grille('Reprise des questions manquées', R.rangs.map((i, k) => ({ cle: k, numero: i + 1, rep: R.reponses[k] })), R.courant, 'data-r')
    : QUIZ.parties.map((nom, p) => grille(UNE_PARTIE ? '' : nomPartie(p),
        questionsDe(p).map(i => ({ cle: i, numero: i + 1, rep: etat.reponses[i] })), etat.courant, 'data-q')).join('');
}

function rendre() {
  rendreProgression();
  if (MODE_CORRIGE) return rendreCorrige();
  const T = tourCourant();
  if (T.etat.courant >= T.total) rendreResultat(); else rendreQuestion(T, T.etat.courant);
}

function boite(marque) {
  return `<span class="boite" aria-hidden="true"><span class="marque${marque ? ' ' + marque : ''}"></span></span>`;
}

function rendreQuestion(T, k) {
  const q = T.question(k), rep = T.etat.reponses[k], ordre = T.etat.ordre[k], derniere = k === T.total - 1;
  const changePartie = !T.reprise && !derniere && QUIZ.questions[k + 1].partie !== q.partie;
  const tete = T.reprise ? `Reprise des questions manquées · ${k + 1} sur ${T.total}` : UNE_PARTIE ? '' : nomPartie(q.partie);
  const suite = derniere ? (T.reprise ? 'Voir le bilan' : 'Voir ma note') : changePartie ? 'Passer à la partie ' + (q.partie + 2) : 'Question suivante';
  let options;
  if (q.type === 'vf') {
    options = [[true, 'Vrai'], [false, 'Faux']].map(([val, lib]) => {
      let cls = 'choix', marque = '';
      if (rep) {
        if (val === q.bonne) { cls += ' juste'; marque = 'coche'; }
        else if (val === rep.choix) { cls += ' erreur'; marque = 'croix'; }
        else cls += ' terne';
      }
      return `<button type="button" class="${cls}" data-val="${val}" aria-pressed="false" ${rep ? 'disabled' : ''}>${boite(marque)}<span class="texte">${lib}</span></button>`;
    }).join('');
  } else {
    options = ordre.map((orig, j) => {
      let cls = 'choix', marque = '';
      if (rep) {
        if (orig === q.bonne) { cls += ' juste'; marque = 'coche'; }
        else if (orig === rep.choix) { cls += ' erreur'; marque = 'croix'; }
        else cls += ' terne';
      }
      return `<button type="button" class="${cls}" data-val="${orig}" aria-pressed="false" ${rep ? 'disabled' : ''}>${boite(marque)}<span class="lettre" aria-hidden="true">${'abcdef'[j]}.</span><span class="texte">${tex(q.choix[orig])}</span></button>`;
    }).join('');
  }
  const revoir = rep && !rep.ok && q.revoir ? `<p class="revoir">À revoir&nbsp;: ${tex(q.revoir)}.</p>` : '';
  const correction = rep ? `<div class="correction ${rep.ok ? 'juste' : 'erreur'}" role="status">
      <p class="verdict">${rep.ok ? 'Correct.' : 'Non.'}</p>
      <div class="explication">${rep.ok ? '' : '<p>La bonne réponse était&nbsp;: ' + reponseTexte(q, q.bonne) + '.</p>'}${explicationHTML(q)}${revoir}</div></div>` : '';
  const bouton = rep
    ? `<button type="button" class="bouton" id="suivant">${suite}</button>`
    : `<button type="button" class="bouton" id="valider" disabled>Valider</button>`;
  zoneQuiz.innerHTML = `<article class="exercice" aria-labelledby="titre-q">
    ${tete ? `<p class="partie">${tete}</p>` : ''}
    <p class="question" id="titre-q"><b>Question ${T.numero(k)}.</b> <i>${q.theme}${q.type === 'vf' ? ' — vrai ou faux' : ''}</i></p>
    <div class="enonce">${tex(q.enonce)}</div>
    <div class="reponses${q.type === 'vf' ? ' vf' : ''}" role="group" aria-label="Réponses">${options}</div>
    <div class="actions">${bouton}</div>
    ${correction}
  </article>`;
  selection = null;
  if (!rep) {
    zoneQuiz.querySelectorAll('.choix').forEach(b => b.addEventListener('click', () => choisir(b, q)));
    $('#valider').addEventListener('click', valider);
  } else {
    $('#suivant').addEventListener('click', suivant);
  }
}

function choisir(b, q) {
  zoneQuiz.querySelectorAll('.choix').forEach(o => {
    const actif = o === b;
    o.classList.toggle('choisi', actif);
    o.setAttribute('aria-pressed', actif ? 'true' : 'false');
    o.querySelector('.marque').className = actif ? 'marque croix' : 'marque';
  });
  selection = q.type === 'vf' ? b.dataset.val === 'true' : Number(b.dataset.val);
  $('#valider').disabled = false;
}

function valider() {
  const T = tourCourant(), k = T.etat.courant, q = T.question(k);
  if (selection === null || T.etat.reponses[k]) return;
  T.etat.reponses[k] = { choix: selection, ok: selection === q.bonne };
  sauver();
  rendre();
  const suivantBtn = $('#suivant');
  if (suivantBtn) suivantBtn.focus({ preventScroll: true });
  const correction = $('.correction');
  if (correction) correction.scrollIntoView({ block: 'nearest', behavior: motion() });
}

// Clic sur un numéro (ou sur sa case) dans les grilles : on ouvre cette question
// (data-q : premier passage ; data-r : reprise des questions manquées).
function aller(cible) {
  if (cible.dataset.r !== undefined) etat.reprise.courant = Number(cible.dataset.r);
  else etat.courant = Number(cible.dataset.q);
  selection = null;
  sauver();
  rendre();
  zoneProg.scrollIntoView({ block: 'start', behavior: motion() });
}

function suivant() {
  const T = tourCourant();
  T.etat.courant = Math.min(T.etat.courant + 1, T.total);
  selection = null;
  sauver();
  rendre();
  // On remonte aux grilles de réponses, pas tout en haut : sur téléphone, l'en-tête occupe un écran.
  zoneProg.scrollIntoView({ block: 'start', behavior: motion() });
}

function recommencer() {
  etat = nouvelEtat();
  selection = null;
  sauver();
  rendre();
  window.scrollTo({ top: 0, behavior: motion() });
}
// Deux clics pour tout effacer : le premier transforme le bouton en demande de confirmation.
function demanderRecommencer(btn) {
  const entame = etat.courant > 0 || etat.reponses.some(Boolean);
  if (btn.dataset.minuteur) {
    clearTimeout(Number(btn.dataset.minuteur));
    btn.textContent = btn.dataset.texte;
    delete btn.dataset.minuteur;
    recommencer();
  } else if (!entame) {
    recommencer();
  } else {
    btn.dataset.texte = btn.textContent;
    btn.textContent = 'Confirmer : effacer mes réponses';
    btn.dataset.minuteur = String(setTimeout(() => { btn.textContent = btn.dataset.texte; delete btn.dataset.minuteur; }, 4000));
  }
}

// Questions regroupées par partie : un titre, puis la liste produite par item(q, i).
function listeParParties(item) {
  return QUIZ.parties.map((nom, p) =>
    `${UNE_PARTIE ? '' : `<h2 class="titre-partie">${nomPartie(p)}</h2>`}<ol class="revue">${questionsDe(p).map(i => item(QUIZ.questions[i], i)).join('')}</ol>`
  ).join('');
}

// Une question de la copie : énoncé, réponse donnée, explication.
function itemRevue(q, rep, numero) {
  const ok = !!(rep && rep.ok);
  let bilan;
  if (!rep) bilan = 'Sans réponse. Bonne réponse&nbsp;: ' + reponseTexte(q, q.bonne) + '.';
  else if (ok) bilan = 'Ta réponse&nbsp;: ' + reponseTexte(q, rep.choix) + '. Correct.';
  else bilan = 'Ta réponse&nbsp;: ' + reponseTexte(q, rep.choix) + '. Faux, la bonne réponse était&nbsp;: ' + reponseTexte(q, q.bonne) + '.';
  return `<li class="${ok ? 'juste' : 'erreur'}">
    <p class="question"><b>Question ${numero}.</b> <i>${q.theme}</i></p>
    <div class="enonce">${tex(q.enonce)}</div>
    <p class="bilan">${bilan}</p>
    <div class="explication">${explicationHTML(q)}</div>
  </li>`;
}

function revueHTML() {
  return listeParParties((q, i) => itemRevue(q, etat.reponses[i], i + 1));
}

function revueRepriseHTML() {
  const R = etat.reprise;
  return `<h2 class="titre-partie">Reprise des questions manquées</h2><ol class="revue">${R.rangs.map((i, k) => itemRevue(variante(i), R.reponses[k], i + 1)).join('')}</ol>`;
}

// Bouton qui montre ou cache une copie.
function bascule(idBouton, idListe, texte) {
  $('#' + idBouton).addEventListener('click', () => {
    const liste = $('#' + idListe), btn = $('#' + idBouton);
    liste.hidden = !liste.hidden;
    btn.setAttribute('aria-expanded', liste.hidden ? 'false' : 'true');
    btn.textContent = (liste.hidden ? 'Revoir ' : 'Masquer ') + texte;
  });
}

// Reprise des questions manquées qui ont une variante : nouveau tour, noté à part.
function reprendre(rangs) {
  etat.reprise = { rangs: rangs, ordre: rangs.map(i => ordreDe(variante(i))), reponses: Array(rangs.length).fill(null), courant: 0 };
  selection = null;
  sauver();
  rendre();
  zoneProg.scrollIntoView({ block: 'start', behavior: motion() });
}

function rendreResultat() {
  const juste = i => !!(etat.reponses[i] && etat.reponses[i].ok);
  const score = QUIZ.questions.filter((q, i) => juste(i)).length;
  const appreciation = score >= 0.75 * N
    ? 'C\'est solide. Relis quand même les explications des questions manquées.'
    : score >= 0.5 * N
      ? 'L\'essentiel est là. Reprends les points listés ci-dessous, puis refais cet entraînement.'
      : 'À retravailler avant l\'évaluation : reprends le cours et la fiche d\'exercices, puis refais cet entraînement.';
  const sur20 = N === 20 ? '' : `<span class="sur">soit ${fr(Math.round(score * 20 / N * 2) / 2)} / 20</span>`;
  const parties = QUIZ.parties.map((nom, p) => {
    const rangs = questionsDe(p);
    return `<span>${nomPartie(p)}&nbsp;: <b>${rangs.filter(juste).length} / ${rangs.length}</b></span>`;
  }).join(' &emsp; ');
  const aRevoir = [];
  QUIZ.questions.forEach((q, i) => { if (!juste(i) && q.revoir && aRevoir.indexOf(q.revoir) < 0) aRevoir.push(q.revoir); });
  const revoir = aRevoir.length
    ? `<div class="a-revoir"><b>À revoir avant l'évaluation&nbsp;:</b><ul>${aRevoir.map(t => '<li>' + tex(t) + '</li>').join('')}</ul></div>` : '';
  // Questions manquées qui ont une variante, et reprise déjà faite (on n'arrive ici qu'une fois finie).
  const manquees = QUIZ.questions.map((q, i) => i).filter(i => !juste(i) && QUIZ.questions[i].variante);
  const R = etat.reprise, nm = manquees.length;
  const bilanReprise = R
    ? `<p class="bilan-reprise">Reprise des questions manquées&nbsp;: <b>${R.reponses.filter(x => x && x.ok).length} / ${R.rangs.length}</b></p>` : '';
  const infoReprise = nm && !R
    ? `<p class="reprise-info">Tu peux refaire ${nm > 1 ? 'les ' + nm + ' questions manquées' : 'la question manquée'}, un peu ${nm > 1 ? 'modifiées' : 'modifiée'}&nbsp;: mêmes notions, autres valeurs.</p>` : '';
  zoneQuiz.innerHTML = `<article class="page-note" aria-labelledby="titre-r">
    <p class="question" id="titre-r"><b>Note.</b></p>
    <p class="note"><span class="grand">${score}</span><span class="sur">/ ${N}</span>${sur20}</p>
    <p class="appreciation">${appreciation}</p>
    ${UNE_PARTIE ? '' : `<p class="bilan-parties">${parties}</p>`}
    ${bilanReprise}
    ${revoir}
    ${infoReprise}
    <div class="actions">
      ${nm ? `<button type="button" class="bouton" id="reprendre">${R ? 'Refaire la reprise' : 'Refaire les questions manquées'}</button>` : ''}
      <button type="button" class="bouton" id="revoir" aria-expanded="false" aria-controls="revue">Revoir la copie</button>
      ${R ? '<button type="button" class="bouton" id="revoir-reprise" aria-expanded="false" aria-controls="revue-reprise">Revoir la reprise</button>' : ''}
      <button type="button" class="bouton discret" id="recommencer">Recommencer</button>
    </div>
    <div id="revue" hidden>${revueHTML()}</div>
    ${R ? `<div id="revue-reprise" hidden>${revueRepriseHTML()}</div>` : ''}
  </article>`;
  bascule('revoir', 'revue', 'la copie');
  if (R) bascule('revoir-reprise', 'revue-reprise', 'la reprise');
  if (nm) $('#reprendre').addEventListener('click', () => reprendre(manquees));
  $('#recommencer').addEventListener('click', e => demanderRecommencer(e.currentTarget));
}

function rendreCorrige() {
  // Énoncé, choix (bonne réponse en vert), explication.
  const corps = q => `<div class="enonce">${tex(q.enonce)}</div>
      ${q.type === 'qcm' ? `<ol class="liste-choix" type="a">${q.choix.map((c, k) => `<li class="${k === q.bonne ? 'bonne' : ''}">${tex(c)}</li>`).join('')}</ol>` : ''}
      <p class="bilan">Bonne réponse&nbsp;: ${reponseTexte(q, q.bonne)}.</p>
      <div class="explication">${explicationHTML(q)}</div>`;
  zoneQuiz.innerHTML = `<article>
    <p class="question"><b>Corrigé.</b> <i>${N} questions, bonnes réponses et explications</i></p>
    ${listeParParties((q, i) => `<li class="juste">
      <p class="question"><b>Question ${i + 1}.</b> <i>${q.theme}</i></p>
      ${corps(q)}
      ${q.variante ? `<div class="variante"><p class="question"><b>Variante</b> <i>(reprise des questions manquées)</i></p>${corps(variante(i))}</div>` : ''}
    </li>`)}
  </article>`;
}

/* ---------- Démarrage ---------- */
$('#reinitialiser').addEventListener('click', e => demanderRecommencer(e.currentTarget));
zoneProg.addEventListener('click', e => {
  const cible = e.target.closest('[data-q],[data-r]');
  if (cible) aller(cible);
});
rendre();
})();
</script>
</body>
</html>
