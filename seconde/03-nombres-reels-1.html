<title>Entraînement Évaluation nombres réels</title>
<!--
  Entraînement auto-corrigé à l'évaluation du chapitre 3 (Nombres réels) - Seconde.
  Une seule partie, douze questions, sans automatismes (demande du professeur pour la
  Seconde), rangées par difficulté croissante, en trois niveaux :
    - niveau 1, questions de cours et lectures directes : définition d'un nombre décimal
      (a/10^n ; variante : nombre rationnel), lire une abscisse, chiffres significatifs,
      troncature et arrondi d'un affichage de la calculatrice ;
    - niveau 2, méthodes en deux ou trois étapes : placer -racine de 3, milieu d'un segment,
      arrondir un résultat avec un nombre de chiffres significatifs adapté, nature d'un
      nombre (division posée), encadrer un quotient (division posée) ;
    - niveau 3, pièges et synthèse : vrai ou faux avec contre-exemple (l'inverse d'un entier
      n'est pas toujours décimal), encadrer une racine carrée en comparant des carrés
      (balayage), appartenance et inclusion (une seule affirmation fausse parmi quatre).
  Sources : cours (définitions formelles : décimal a/10^n, rationnel a/b, réels abscisses des
  points de la droite, irrationnel ; encadrement, troncature, arrondi), capacités 1 à 3,
  activités 1 et 2, fiche (exercices 1 à 5), évaluation (sujets A et B) et exercices du manuel
  cités dans le plan (1 p. 50, 34, 35, 37 et 38 p. 65, 113 et 121 p. 69, 178 et 181 p. 75,
  questions 5 à 7 p. 73).
  La question de cours sur la définition d'un décimal remplace l'ancienne question
  « encadrement de racine de 23 à 10^(-2) à partir de l'affichage », redondante avec la
  troncature (même lecture de l'affichage, l'encadrement est rappelé dans sa correction) et
  avec l'encadrement d'un quotient.
  Mêmes types de questions que dans le cours, la fiche et l'évaluation, avec d'autres valeurs.
  Calculatrice interdite, comme à l'évaluation : les affichages utiles sont donnés. Ni
  intervalle ni valeur absolue (chapitre 5).
  Calculs détaillés, une transformation par ligne : produit de décimaux décomposé
  (3,1 x 3,1 = 3,1 x 3 + 3,1 x 0,1), simplification avec le facteur commun en violet.
  Ensembles de nombres : \N, \Z et \R, compris par KaTeX et par le mini-LaTeX de secours ;
  𝔻 et ℚ en caractères Unicode, que les deux affichent aussi (de même que ⊂).
  Chaque question a une variante (mêmes notions, autres valeurs) pour la reprise des
  questions manquées.

  Page générée par tools/entrainement.py : ne pas la modifier ici. Questions :
  entrainement-03-nombres-reels-1-questions.js (même dossier) ; moteur et mise en page :
  Commun aux cours/entrainement/gabarit.html (format des questions en tête).
  Publiée pour les élèves : https://p-bailly.github.io/entrainements/seconde/03-nombres-reels-1.html
  (python tools/entrainement.py --publier). Vue corrigé : ?corrige à la fin de l'adresse.
-->

<style>
:root{
  --papier:#FFFFFF; --fond:#EDEDED; --encre:#161616; --gris:#5C5C5C; --filet:#CCCCCC; --case:#F2F2F2;
  --stylo:#1E3D96; --rouge:#C62026; --vert:#1C7436; --orange:#E8940A; --violet:#5B3E96;
  --bleu-clair:#E8EDF8; --vert-clair:#E6F2E9; --rouge-clair:#FAE9E9;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SFMono-Regular",Consolas,"Roboto Mono",monospace;
  --bas:72px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{margin:0; min-height:100vh; background:var(--fond); color:var(--encre); font:400 17px/1.5 var(--sans); -webkit-tap-highlight-color:transparent}
button{font-family:inherit}

/* Barre du haut : retour, lycée et chapitre, compteur, avancement */
.haut{position:sticky; top:0; z-index:5; background:var(--papier); border-bottom:1px solid var(--filet); padding-top:env(safe-area-inset-top)}
.haut .ligne{display:flex; align-items:center; gap:6px; max-width:40rem; margin:0 auto; padding:6px 14px 4px 6px; min-height:52px}
.retour{flex:none; display:grid; place-items:center; width:44px; height:44px; color:var(--encre); border-radius:50%}
.retour:active{background:var(--case)}
.retour svg{width:22px; height:22px}
.titres{flex:1; min-width:0; line-height:1.25}
.titres span{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.titres .lycee{font-size:.78rem; color:var(--gris); white-space:normal}
.titres .chap{font-size:.95rem; font-weight:600}
.compteur{flex:none; font-size:.95rem; font-weight:600; font-variant-numeric:tabular-nums}
.segments{display:flex; gap:3px; max-width:40rem; margin:0 auto; padding:0 14px 4px}
.segments button{flex:1; min-width:0; height:18px; margin:0; padding:0; border:0; background:none; cursor:pointer; position:relative}
.segments button::before{content:""; position:absolute; left:0; right:0; top:6px; height:6px; border-radius:3px; background:#D6D6D6}
.segments button.juste::before{background:var(--vert)}
.segments button.faux::before{background:var(--rouge)}
.segments button.ici::before{background:var(--encre)}
.segments button.vu::before{box-shadow:0 0 0 1.5px var(--papier), 0 0 0 3px var(--encre)}

/* Écran */
main{max-width:40rem; margin:0 auto; padding:14px 12px calc(var(--bas) + 28px + env(safe-area-inset-bottom))}
body.avec-brouillon main{padding-bottom:calc(var(--bas) + min(56vh, 480px) + 28px)}
.carte{background:var(--papier); border:1px solid var(--filet); border-radius:10px; padding:16px}
.carte + .carte,.carte + .retour-corr{margin-top:12px}
.meta{margin:0 0 8px; font-size:.9rem; font-weight:600; color:var(--gris)}
.meta span{font-weight:400}
.partie{margin:0 0 4px; font-size:.82rem; color:var(--gris)}
.enonce{font-size:1.06rem; margin:0 0 16px}
.enonce p{margin:0 0 .5em}
.bandeau-reprise{margin:0 0 10px; padding:8px 12px; border-radius:8px; background:var(--bleu-clair); font-size:.9rem}

/* Réponses : grands boutons */
.options{display:grid; grid-template-columns:minmax(0,1fr); gap:10px}
.option{display:flex; align-items:center; gap:12px; width:100%; min-height:56px; margin:0; padding:10px 12px; border:1.5px solid var(--filet); border-radius:9px; background:var(--papier); color:var(--encre); font-size:1.02rem; line-height:1.4; text-align:left; cursor:pointer; touch-action:manipulation}
.option:active:not(:disabled){background:var(--case)}
@media (hover:hover){.option:hover:not(:disabled){border-color:var(--gris)}}
.option:disabled{cursor:default; color:var(--encre)}
.pastille{flex:none; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; border:1.5px solid var(--filet); font-size:.9rem; font-weight:600; color:var(--gris)}
.option .texte{flex:1; min-width:0}
.option .icone{flex:none; font-weight:700; font-size:1.15rem}
.option[aria-checked="true"]{border-color:var(--stylo); background:var(--bleu-clair)}
.option[aria-checked="true"] .pastille{border-color:var(--stylo); background:var(--stylo); color:#FFF}
.option.juste{border-color:var(--vert); background:var(--vert-clair)}
.option.juste .pastille{border-color:var(--vert); background:var(--vert); color:#FFF}
.option.juste .icone{color:var(--vert)}
.option.faux{border-color:var(--rouge); background:var(--rouge-clair)}
.option.faux .pastille{border-color:var(--rouge); background:var(--rouge); color:#FFF}
.option.faux .icone{color:var(--rouge)}
.option.terne{color:var(--gris); border-color:#E0E0E0}

/* Correction sous la question */
.retour-corr{background:var(--papier); border:1px solid var(--filet); border-left:5px solid var(--rouge); border-radius:10px; padding:14px 16px; scroll-margin-bottom:calc(var(--bas) + 16px)}
.retour-corr.juste{border-left-color:var(--vert)}
.verdict{margin:0 0 8px; font-weight:700}
.retour-corr.faux .verdict{color:var(--rouge)}
.retour-corr.juste .verdict{color:var(--vert)}
.explication{font-size:.98rem}
.revoir{margin:10px 0 0; font-size:.92rem; color:var(--gris)}

/* Écran de départ */
.intro h1{margin:0 0 2px; font-size:1.5rem; line-height:1.2}
.intro .sous{margin:0 0 12px; color:var(--gris)}
.intro p:last-child{margin-bottom:0}

/* Résultat */
.score{margin:0; font-size:1.3rem}
.score b{font-size:3rem; line-height:1}
.sur20{margin:2px 0 10px; color:var(--gris)}
.appreciation{margin:0}
.bilan-reprise,.bilan-parties{margin:10px 0 0}
.a-revoir{margin:0; padding-left:1.1em}
.titre-liste{margin:22px 4px 8px; font-size:1rem}
.recap{list-style:none; margin:0; padding:0; background:var(--papier); border:1px solid var(--filet); border-radius:10px; overflow:hidden}
.recap li + li{border-top:1px solid var(--filet)}
.recap summary{display:flex; align-items:center; gap:12px; min-height:52px; padding:8px 14px; cursor:pointer; list-style:none}
.recap summary::-webkit-details-marker{display:none}
.recap .num{flex:none; width:1.6em; font-weight:600; font-variant-numeric:tabular-nums}
.recap .theme{flex:1; min-width:0}
.recap .icone{flex:none; font-weight:700; font-size:1.1rem}
.recap li.juste .icone{color:var(--vert)}
.recap li.faux .icone,.recap li.vide .icone{color:var(--rouge)}
.recap details[open] summary{background:var(--case)}
.recap .detail{padding:12px 14px 16px}
.ta-rep{margin:0 0 10px; font-size:.95rem}

/* Barre du bas : brouillon et bouton principal, sous le pouce */
.bas{position:fixed; left:0; right:0; bottom:0; z-index:6; background:var(--papier); border-top:1px solid var(--filet); padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bas .dedans{max-width:40rem; margin:0 auto; display:flex; gap:10px}
.btn{min-height:50px; padding:6px 16px; border:1.5px solid var(--encre); border-radius:9px; background:var(--papier); color:var(--encre); font-size:1rem; font-weight:600; line-height:1.2; cursor:pointer; touch-action:manipulation}
.btn.principal{flex:1; border-color:var(--stylo); background:var(--stylo); color:#FFF}
.btn:disabled{opacity:.4; cursor:default}
.btn[aria-pressed="true"]{background:var(--encre); color:#FFF}
.btn:active:not(:disabled){filter:brightness(.92)}

/* Brouillon : petits carreaux (dessinés dans la toile), on écrit au doigt ; deux doigts déplacent et zooment */
.brouillon{position:fixed; left:0; right:0; bottom:calc(var(--bas) + env(safe-area-inset-bottom)); z-index:6; height:min(56vh, 480px); display:flex; flex-direction:column; background:var(--papier); border-top:1px solid var(--encre)}
.brouillon .outils{display:flex; align-items:center; gap:6px; padding:6px 10px; border-bottom:1px solid var(--filet)}
.brouillon .outils .titre{flex:1; font-size:.85rem; color:var(--gris)}
.outil{min-height:40px; padding:4px 12px; border:1px solid var(--filet); border-radius:8px; background:var(--papier); color:var(--encre); font-size:.9rem; cursor:pointer}
.outil[aria-pressed="true"]{border-color:var(--encre); background:var(--case); font-weight:600}
.toile{flex:1; display:block; width:100%; min-height:0; touch-action:none; cursor:crosshair; background:#FFF}
.recentrer{position:absolute; right:10px; bottom:10px; box-shadow:0 1px 4px rgba(0,0,0,.2)}

:focus-visible{outline:2px solid var(--stylo); outline-offset:2px}
@media (min-width:700px){
  main{padding-top:22px}
  .carte{padding:20px 22px}
  .brouillon{left:50%; width:40rem; transform:translateX(-50%); border:1px solid var(--encre); border-bottom:0; border-radius:10px 10px 0 0}
}
@media print{ .bas,.brouillon,.segments{display:none} }

.fig{display:block; width:100%; height:auto; margin:12px auto 4px}

.fig .lab{font:italic 13px var(--serif); fill:currentColor; paint-order:stroke; stroke:var(--papier); stroke-width:3px; stroke-linejoin:round}

.fig .lecture{stroke:var(--vert); stroke-width:1.5; stroke-dasharray:5 3; fill:none}
.fig .pointe{fill:var(--vert)}
.fig .note{font:italic 11.5px var(--serif); fill:var(--vert); paint-order:stroke; stroke:var(--papier); stroke-width:3px; stroke-linejoin:round}

table.tableur{border-collapse:collapse; margin:10px auto 4px; font:400 .88rem "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
table.tableur th{background:var(--case); color:var(--gris); font-weight:400; border:1px solid var(--filet); padding:2px 10px; text-align:center; min-width:2.2em}
table.tableur td{border:1px solid var(--filet); padding:2px 10px; min-width:5em; height:1.9em; background:#FFFFFF; text-align:center}

/* Formules : KaTeX, sinon mini-LaTeX (.m) */
.katex{font-size:1.1em}

.m sub,.m sup{font-size:.8em; line-height:0; white-space:nowrap}
.m .prime{display:inline-block; margin-left:.08em; font-size:1.2em; line-height:0}

<script>
(function () {
'use strict';
const r = String.raw;

/* ---------- Figures (SVG généré) ---------- */
const arrondi = x => Math.round(x * 10) / 10;
const fr = x => String(x).replace('.', ',');
const moins = n => String(n).replace('-', '−');
function fleche(x, y, sens) {
  return sens === 'droite'
    ? `<path class="fleche" d="M${x} ${y} l-7 -3.5 v7 z"/>`
    : `<path class="fleche" d="M${x} ${y} l-3.5 7 h7 z"/>`;
}
// Repère orthonormé quadrillé et gradué de 1 en 1. o = {xmin, xmax, ymin, ymax, label, echelle} et, au choix :
//   courbes  : [{f: x => ..., classe, x1, x2}]        classe = c-rouge (défaut), c-bleu, c-noir, c-violet
//   noms     : [{x, y, texte, indice, apres, classe, ancre}]   nom d'une courbe, dans sa couleur
//   lectures : [[[x, y], [x, y], ...], ...]            lignes de lecture en tirets verts, flèche au bout
//   textes   : [{x, y, texte, ancre}]                  annotations vertes des lectures (+1, +3...)
//   points   : [{x, y, classe}]
//   surligne : {x1, x2}                                partie de l'axe des abscisses surlignée en orange (null = bord du repère)
let numeroFigure = 0;
function repere(o) {
  const u = 26, m = 17;
  const W = (o.xmax - o.xmin) * u + 2 * m, H = (o.ymax - o.ymin) * u + 2 * m;
  const X = x => arrondi(m + (x - o.xmin) * u), Y = y => arrondi(m + (o.ymax - y) * u);
  const cadre = 'cadre-' + (++numeroFigure);
  const xfin = X(o.xmax) + 12, yhaut = Y(o.ymax) - 12;
  let s = `<svg class="fig" viewBox="0 0 ${W} ${H}" style="max-width:${Math.round(W * (o.echelle || 1.3))}px" role="img" aria-label="${o.label}">`;
  s += `<defs><clipPath id="${cadre}"><rect x="${X(o.xmin)}" y="${Y(o.ymax)}" width="${(o.xmax - o.xmin) * u}" height="${(o.ymax - o.ymin) * u}"/></clipPath></defs>`;
  for (let x = o.xmin; x <= o.xmax; x++) s += `<line class="grille" x1="${X(x)}" y1="${Y(o.ymin)}" x2="${X(x)}" y2="${Y(o.ymax)}"/>`;
  for (let y = o.ymin; y <= o.ymax; y++) s += `<line class="grille" x1="${X(o.xmin)}" y1="${Y(y)}" x2="${X(o.xmax)}" y2="${Y(y)}"/>`;
  if (o.surligne) {
    const x1 = o.surligne.x1 === null ? o.xmin : o.surligne.x1, x2 = o.surligne.x2 === null ? o.xmax : o.surligne.x2;
    s += `<line class="surligne" x1="${X(x1)}" y1="${Y(0)}" x2="${X(x2)}" y2="${Y(0)}"/>`;
  }
  s += `<line class="axe" x1="${X(o.xmin)}" y1="${Y(0)}" x2="${xfin}" y2="${Y(0)}"/>${fleche(xfin, Y(0), 'droite')}`;
  s += `<line class="axe" x1="${X(0)}" y1="${Y(o.ymin)}" x2="${X(0)}" y2="${yhaut}"/>${fleche(X(0), yhaut, 'haut')}`;
  (o.courbes || []).forEach(c => {
    const x1 = c.x1 === undefined ? o.xmin : c.x1, x2 = c.x2 === undefined ? o.xmax : c.x2, n = 80;
    let d = '';
    for (let k = 0; k <= n; k++) { const x = x1 + (x2 - x1) * k / n; d += (k ? ' L' : 'M') + X(x) + ' ' + Y(c.f(x)); }
    s += `<path class="courbe ${c.classe || 'c-rouge'}" clip-path="url(#${cadre})" d="${d}"/>`;
  });
  (o.lectures || []).forEach(pts => {
    const P = pts.map(p => [X(p[0]), Y(p[1])]);
    const a = P[P.length - 2], b = P[P.length - 1];
    const L = Math.hypot(b[0] - a[0], b[1] - a[1]), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L;
    s += `<polyline class="lecture" points="${P.map(p => p.join(',')).join(' ')}"/>`;
    s += `<path class="pointe" d="M${b[0]} ${b[1]} L${arrondi(b[0] - 7 * ux + 3.2 * uy)} ${arrondi(b[1] - 7 * uy - 3.2 * ux)} L${arrondi(b[0] - 7 * ux - 3.2 * uy)} ${arrondi(b[1] - 7 * uy + 3.2 * ux)} z"/>`;
  });
  // Graduations sur fond papier, par-dessus les courbes et les lectures : elles restent lisibles.
  for (let x = o.xmin; x <= o.xmax; x++) if (x !== 0) s += `<text class="tick" x="${X(x)}" y="${Y(0) + 13}" text-anchor="middle">${moins(x)}</text>`;
  for (let y = o.ymin; y <= o.ymax; y++) if (y !== 0) s += `<text class="tick" x="${X(0) - 5}" y="${Y(y) + 3.5}" text-anchor="end">${moins(y)}</text>`;
  s += `<text class="tick" x="${X(0) - 5}" y="${Y(0) + 13}" text-anchor="end">0</text>`;
  (o.points || []).forEach(p => { s += `<circle class="pt ${p.classe || 'c-rouge'}" cx="${X(p.x)}" cy="${Y(p.y)}" r="3.3"/>`; });
  (o.textes || []).forEach(t => { s += `<text class="note" x="${X(t.x)}" y="${Y(t.y)}" text-anchor="${t.ancre || 'middle'}">${t.texte}</text>`; });
  (o.noms || []).forEach(n => {
    const indice = n.indice ? `<tspan dy="3" font-size="9.5">${n.indice}</tspan>` + (n.apres ? `<tspan dy="-3">${n.apres}</tspan>` : '') : '';
    s += `<text class="lab ${n.classe || 'c-rouge'}" x="${X(n.x)}" y="${Y(n.y)}" text-anchor="${n.ancre || 'start'}">${n.texte}${indice}</text>`;
  });
  return s + '</svg>';
}
// Feuille de calcul (question sur le tableur) : lignes = [[A, B], ...] à partir de la ligne 1 ;
// la cellule '#sel' est la cellule sélectionnée, laissée vide.
function tableur(lignes, label) {
  const cellule = c => c === '#sel' ? '<td class="sel"></td>' : `<td>${c}</td>`;
  return `<table class="tableur" aria-label="${label}"><tr><th></th><th>A</th><th>B</th></tr>`
    + lignes.map((l, k) => `<tr><th>${k + 1}</th>${cellule(l[0])}${cellule(l[1])}</tr>`).join('')
    + '</table>';
}

// Calcul en colonne, comme l'environnement calcul des PDF : une étape par ligne, alignées sur le
// signe placé après & (formules écrites sans les dollars). Le résultat s'encadre avec \resultat{...}.
//   calcul(r`A & = x - 4(3x + 2)`, r`& = x - 12x - 8`, r`& = \resultat{-11x - 8}`)
function calcul(...lignes) {
  return '<div class="calcul">' + lignes.map(l => {
    const k = l.indexOf('&');
    const gauche = k < 0 ? '' : l.slice(0, k).trim(), droite = (k < 0 ? l : l.slice(k + 1)).trim();
    return '<span class="g">' + (gauche ? '$' + gauche + '$' : '') + '</span><span class="d">$' + droite + '$</span>';
  }).join('') + '</div>';
}

// Droite graduée des questions sur la droite numérique, de la même allure que repere()
// (gabarit) : axe fin fléché, unité partagée en quatre (graduations de 0,25), entiers
// numérotés. Écrite par concaténation de chaînes, sans gabarit de chaîne.
//   o = {xmin, xmax, label, points, lectures}
//   points   : [{x, nom, classe}], nom au-dessus du point ; classe c-rouge (défaut, points de
//              l'énoncé) ou c-bleu (point placé dans la correction) ;
//   lectures : [{x1, x2, texte, niveau}], segment en tirets verts au-dessus de l'axe, de x1 à
//              x2, avec son texte vert ; niveau 1 (défaut) ou 2 (plus haut).
// La hauteur de la figure dépend du plus haut niveau de lecture (aucun, 1 ou 2).
function droiteGraduee(o) {
  const niveaux = (o.lectures || []).map(l => l.niveau || 1);
  const u = 44, marge = 16, yAxe = [26, 44, 68][Math.max(0, ...niveaux)], hauteur = yAxe + 26;
  const largeur = (o.xmax - o.xmin) * u + 2 * marge + 14;
  const X = x => Math.round((marge + (x - o.xmin) * u) * 10) / 10;
  const nombre = x => String(x).replace('.', ',').replace('-', '−');
  let s = '<svg class="fig" viewBox="0 0 ' + largeur + ' ' + hauteur + '" style="max-width:'
    + Math.round(largeur * 1.6) + 'px" role="img" aria-label="' + o.label + '">';
  s = s + '<line class="axe" x1="' + (X(o.xmin) - 10) + '" y1="' + yAxe + '" x2="' + (largeur - 4) + '" y2="' + yAxe + '"/>';
  s = s + '<path class="fleche" d="M' + (largeur - 4) + ' ' + yAxe + ' l-7 -3.5 v7 z"/>';
  for (let k = 0; k <= (o.xmax - o.xmin) * 4; k++) {
    const x = o.xmin + k / 4, h = k % 4 === 0 ? 6 : 3.5;
    s = s + '<line class="axe" x1="' + X(x) + '" y1="' + (yAxe - h) + '" x2="' + X(x) + '" y2="' + (yAxe + h) + '"/>';
    if (k % 4 === 0) s = s + '<text class="tick" x="' + X(x) + '" y="' + (yAxe + 20) + '" text-anchor="middle">' + nombre(x) + '</text>';
  }
  (o.lectures || []).forEach(l => {
    const y = yAxe - (l.niveau === 2 ? 50 : 26);
    s = s + '<line class="lecture" x1="' + X(l.x1) + '" y1="' + y + '" x2="' + X(l.x2) + '" y2="' + y + '"/>';
    [l.x1, l.x2].forEach(x => {
      s = s + '<line class="lecture" style="stroke-dasharray:none" x1="' + X(x) + '" y1="' + (y - 3) + '" x2="' + X(x) + '" y2="' + (y + 3) + '"/>';
    });
    s = s + '<text class="note" x="' + X((l.x1 + l.x2) / 2) + '" y="' + (y - 5) + '" text-anchor="middle">' + l.texte + '</text>';
  });
  (o.points || []).forEach(p => {
    const c = p.classe || 'c-rouge';
    s = s + '<circle class="pt ' + c + '" cx="' + X(p.x) + '" cy="' + yAxe + '" r="3.3"/>';
    s = s + '<text class="lab ' + c + '" x="' + X(p.x) + '" y="' + (yAxe - 9) + '" text-anchor="middle">' + p.nom + '</text>';
  });
  return s + '</svg>';
}
// Toutes les droites de l'entraînement vont de -3 à 3, comme dans le cours et l'évaluation.
const droite = o => droiteGraduee(Object.assign({ xmin: -3, xmax: 3 }, o));

/* ---------- Conversion des formules ($...$, mini-LaTeX) en HTML ---------- */
const SYM = {
  times: '×', cdot: '·', dots: '…', ldots: '…', cdots: '…', ne: '≠', neq: '≠', le: '≤', leq: '≤',
  ge: '≥', geq: '≥', approx: '≈', infty: '∞', forall: '∀', in: '∈', N: 'ℕ', R: 'ℝ', Z: 'ℤ',
  pm: '±', Delta: 'Δ', sum: 'Σ', pi: 'π', alpha: 'α', mapsto: '↦', to: '→', iff: '⇔',
  Longleftrightarrow: '⇔', Leftrightarrow: '⇔', Rightarrow: '⇒', implies: '⇒',
  quad: ' ', qquad: '  ', displaystyle: '', left: '', right: ''
};
const SYM1 = { ',': ' ', ';': ' ', ' ': ' ', '{': '{', '}': '}', '%': '%', '_': '_', '&': '&amp;', '$': '$', '\\': '<br>' };
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function math(s) {
  let i = 0;
  const skip = () => { while (i < s.length && s[i] === ' ') i++; };
  function raw() {            // contenu brut d'un {groupe}, sans mise en italique
    skip();
    if (s[i] !== '{') return esc(s[i++] || '');
    let prof = 0, out = '';
    for (; i < s.length; i++) {
      const c = s[i];
      if (c === '{') { prof++; if (prof === 1) continue; }
      if (c === '}') { prof--; if (prof === 0) { i++; break; } }
      out += c;
    }
    return esc(out);
  }
  function group() { i++; let out = ''; while (i < s.length && s[i] !== '}') out += atom(); i++; return out; }
  function arg() { skip(); if (s[i] === '{') return group(); return atom(); }
  const frac = (a, b) => `<span class="frac"><span class="num">${a}</span><span class="den">${b}</span></span>`;
  function atom() {
    if (i >= s.length) return '';
    const c = s[i];
    if (c === '{') return group();
    if (c === '}') { i++; return ''; }
    if (c === '\\') {
      const n = s[i + 1];
      if (n === undefined) { i++; return ''; }
      if (!/[a-zA-Z]/.test(n)) { i += 2; return SYM1[n] !== undefined ? SYM1[n] : esc(n); }
      let j = i + 1;
      while (j < s.length && /[a-zA-Z]/.test(s[j])) j++;
      const nom = s.slice(i + 1, j); i = j;
      if (nom === 'frac' || nom === 'dfrac' || nom === 'tfrac') { const a = arg(); const b = arg(); return frac(a, b); }
      if (nom === 'mathrm' || nom === 'text') return `<span class="rm">${raw()}</span>`;
      if (nom === 'textbf') return `<b class="rm">${raw()}</b>`;
      if (nom === 'mathscr') return `<i>${raw()}</i>`;
      if (nom === 'resultat') return `<span class="resultat">${arg()}</span>`;
      if (nom === 'mul') return `<span class="mul">${arg()}</span>`;
      if (nom === 'op') return `<span class="op">${arg()}</span>`;
      if (nom === 'sqrt') return `<span class="sqrt">√<span class="rad">${arg()}</span></span>`;
      return SYM[nom] !== undefined ? SYM[nom] : esc('\\' + nom);
    }
    if (c === '_' || c === '^') { i++; const a = arg(); return c === '_' ? `<sub>${a}</sub>` : `<sup>${a}</sup>`; }
    i++;
    if (/[a-zA-Z]/.test(c)) return `<i>${c}</i>`;
    if (c === '-') return '−';
    if (c === '*') return '×';
    if (c === "'") return '<span class="prime">′</span>';
    return esc(c);
  }
  let out = '';
  while (i < s.length) out += atom();
  return out;
}
// Une formule : KaTeX s'il est chargé, sinon (pas encore là, hors ligne, CDN filtré, commande qu'il
// refuse) le mini-LaTeX, qui garde la source dans data-tex pour que katexPret() la recompose.
// (## : signe # d'une couleur dans une macro, # seul désignant un argument)
const MACROS = { '\\mul': '\\textcolor{##9C27B0}{#1}', '\\op': '\\textcolor{##CE2029}{#1}', '\\resultat': '\\boxed{#1}' };
function katexDispo() {
  const feuille = document.getElementById('katex-css');
  return !!window.katex && !!feuille && feuille.media === 'all';
}
function katexHTML(f) {
  try { return katex.renderToString(f, { macros: Object.assign({}, MACROS), throwOnError: true, strict: false }); }
  catch (e) { return null; }
}
function formule(f) {
  const k = katexDispo() ? katexHTML(f) : null;
  return k || `<span class="m${f.length > 42 ? ' m-long' : ''}" data-tex="${esc(f).replace(/"/g, '&quot;')}">${math(f)}</span>`;
}
window.katexPret = function () {
  if (!katexDispo()) return;
  document.querySelectorAll('.m[data-tex]').forEach(e => {
    const k = katexHTML(e.dataset.tex);
    if (k) e.outerHTML = k;
  });
};
function tex(src) {
  return String(src).split(/(\$[^$]*\$)/).map(p =>
    (p.length >= 2 && p[0] === '$' && p[p.length - 1] === '$') ? formule(p.slice(1, -1)) : p
  ).join('');
}

const variante = i => Object.assign({}, QUIZ.questions[i], QUIZ.questions[i].variante);

function melange(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  try {
    const s = JSON.parse(localStorage.getItem(CLE));
    if (s && s.signature === SIGNATURE && Array.isArray(s.reponses) && s.reponses.length === N && Array.isArray(s.ordre)) {
      s.courant = Math.min(Math.max(0, s.courant | 0), N);
      if (repriseValide(s.reprise)) s.reprise.courant = Math.min(Math.max(0, s.reprise.courant | 0), s.reprise.rangs.length);
      else s.reprise = null;
      return s;
    }
  } catch (e) { /* stockage indisponible : on repart de zéro */ }
  return null;
}
function sauver() { try { localStorage.setItem(CLE, JSON.stringify(etat)); } catch (e) { /* sans importance */ } }

let etat = charger() || nouvelEtat();
let selection = null;

/* ---------- Outils de l'affichage ---------- */
const $ = sel => document.querySelector(sel);
const motion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
const UNE_PARTIE = QUIZ.parties.length === 1;
const nomPartie = p => `Partie ${p + 1} · ${QUIZ.parties[p]}`;
const questionsDe = p => QUIZ.questions.map((q, i) => q.partie === p ? i : -1).filter(i => i >= 0);
const LETTRES = 'abcdefgh';
const estJuste = rep => !!(rep && rep.ok);

// Explication : un texte, ou une liste de blocs (paragraphes, calculs en colonne, figures).
function explicationHTML(q) {
  const blocs = Array.isArray(q.explication) ? q.explication : [q.explication];
  return blocs.map(b => /^<(div|svg)\b/.test(b) ? tex(b) : '<p>' + tex(b) + '</p>').join('');
}
// Valeurs proposées, dans l'ordre de l'élève : [true, false] pour un vrai ou faux.
const valeursDe = (q, ordre) => q.type === 'vf' ? [true, false] : ordre;
const lettreDe = (q, ordre, val) => q.type === 'vf' ? '' : LETTRES[ordre.indexOf(val)];
// Une réponse en toutes lettres : « Vrai », ou « c) 3x − 1 ».
function reponseTexte(q, ordre, val) {
  if (q.type === 'vf') return val ? 'Vrai' : 'Faux';
  return lettreDe(q, ordre, val) + ')&nbsp;' + tex(q.choix[val]);
}
const lireValeur = (q, s) => q.type === 'vf' ? s === 'true' : Number(s);
const noteSur20 = (score, n) => fr(Math.round(score * 20 / n * 2) / 2);
function appreciation(score, n) {
  if (score >= 0.75 * n) return 'C\'est solide. Relis quand même la correction des questions manquées.';
  if (score >= 0.5 * n) return 'L\'essentiel est là. Reprends les points ci-dessous, puis refais l\'entraînement.';
  return 'À retravailler avant l\'évaluation : reprends le cours et la fiche d\'exercices, puis refais l\'entraînement.';
}
function listeARevoir() {
  const l = [];
  QUIZ.questions.forEach((q, i) => { if (!estJuste(etat.reponses[i]) && q.revoir && l.indexOf(q.revoir) < 0) l.push(q.revoir); });
  return l;
}
// Questions manquées (fausses ou sans réponse) qui ont une variante.
const manquees = () => QUIZ.questions.map((q, i) => i).filter(i => !estJuste(etat.reponses[i]) && QUIZ.questions[i].variante);
const nouvelleReprise = rangs => ({ rangs: rangs, ordre: rangs.map(i => ordreDe(variante(i))), reponses: Array(rangs.length).fill(null), courant: 0 });
// Tour en cours : le premier passage, ou la reprise des questions manquées (leurs variantes).
function tourCourant() {
  const R = etat.reprise;
  if (R && R.courant < R.rangs.length)
    return { reprise: true, etat: R, total: R.rangs.length, question: k => variante(R.rangs[k]), numero: k => R.rangs[k] + 1 };
  return { reprise: false, etat: etat, total: N, question: k => QUIZ.questions[k], numero: k => k + 1 };
}
// Deux appuis pour effacer : le premier transforme le bouton en demande de confirmation.
function confirmer(btn, texte, action) {
  if (btn.dataset.minuteur) {
    clearTimeout(Number(btn.dataset.minuteur));
    btn.textContent = btn.dataset.texte;
    delete btn.dataset.minuteur;
    action();
  } else {
    btn.dataset.texte = btn.textContent;
    btn.textContent = texte;
    btn.dataset.minuteur = String(setTimeout(() => { btn.textContent = btn.dataset.texte; delete btn.dataset.minuteur; }, 4000));
  }
}
const pluriel = (n, mot) => n + ' ' + mot + (n > 1 ? 's' : '');

/* ---------- Affichage : une question par écran ---------- */
const ecran = $('#ecran'), intro = $('#intro'), segments = $('#segments'), compteur = $('#compteur');
const btnG = $('#gauche'), btnP = $('#principal');
let introFaite = false;   // écran de départ montré tant que rien n'est commencé
let actionG = null, actionP = null;
{
  const t = $('#intro-titre'), morceaux = t.textContent.split(' · ');
  if (morceaux.length > 1) { $('#intro-num').textContent = morceaux[0] + ' · ' + N + ' questions'; t.textContent = morceaux.slice(1).join(' · '); }
}

// Barre du bas : bouton de gauche (brouillon, recommencer) et bouton principal.
function barreBas(g, p) {
  [btnG, btnP].forEach(b => { if (b.dataset.minuteur) { clearTimeout(Number(b.dataset.minuteur)); delete b.dataset.minuteur; } });
  btnG.hidden = !g;
  if (g) {
    btnG.textContent = g.texte; actionG = g.action;
    if (g.presse === undefined) btnG.removeAttribute('aria-pressed'); else btnG.setAttribute('aria-pressed', g.presse ? 'true' : 'false');
  }
  btnP.textContent = p.texte; btnP.disabled = !!p.desactive; actionP = p.action;
}
btnG.addEventListener('click', () => { if (actionG) actionG(btnG); });
btnP.addEventListener('click', () => { if (actionP && !btnP.disabled) actionP(btnP); });

function rendre() {
  if (MODE_CORRIGE) return rendreCorrige();
  const T = tourCourant();
  rendreSegments(T);
  intro.hidden = introFaite;
  ecran.hidden = !introFaite;
  if (!introFaite) {
    compteur.textContent = '';
    return barreBas(null, { texte: 'Commencer', action: () => { introFaite = true; rendre(); } });
  }
  if (T.etat.courant >= T.total) return rendreResultat();
  rendreQuestion(T, T.etat.courant);
}

function rendreSegments(T) {
  const fini = !T.reprise && etat.courant >= N;
  segments.innerHTML = Array.from({ length: T.total }, (_, k) => {
    const rep = T.etat.reponses[k];
    const ici = introFaite && !fini && k === T.etat.courant;
    const cls = (rep ? (rep.ok ? 'juste' : 'faux') : '') + (ici ? (rep ? ' vu' : ' ici') : '');
    return `<button type="button" class="${cls}" data-k="${k}" aria-label="Question ${T.numero(k)}${rep ? (rep.ok ? ', juste' : ', fausse') : ''}"></button>`;
  }).join('');
  compteur.textContent = fini ? '' : `${Math.min(T.etat.courant + 1, T.total)} / ${T.total}`;
}
segments.addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (!b || MODE_CORRIGE) return;
  const T = tourCourant();
  T.etat.courant = Number(b.dataset.k);
  introFaite = true; selection = null;
  sauver(); rendre(); window.scrollTo(0, 0);
});

const brouillonBouton = () => ({ texte: 'Brouillon', action: basculerBrouillon, presse: brouillonOuvert });

function rendreQuestion(T, k) {
  const q = T.question(k), rep = T.etat.reponses[k], ordre = T.etat.ordre[k], derniere = prochaine(T) === T.total;
  const options = valeursDe(q, ordre).map(val => {
    let cls = 'option', icone = '';
    if (rep) {
      if (val === q.bonne) { cls += ' juste'; icone = '✓'; }
      else if (val === rep.choix) { cls += ' faux'; icone = '✗'; }
      else cls += ' terne';
    }
    const coche = rep ? val === rep.choix : val === selection;
    const lettre = q.type === 'vf' ? (val ? 'V' : 'F') : lettreDe(q, ordre, val).toUpperCase();
    const lib = q.type === 'vf' ? (val ? 'Vrai' : 'Faux') : tex(q.choix[val]);
    return `<button type="button" class="${cls}" role="radio" aria-checked="${coche}" data-val="${val}"${rep ? ' disabled' : ''}>`
      + `<span class="pastille" aria-hidden="true">${lettre}</span><span class="texte">${lib}</span>${icone ? `<span class="icone" aria-hidden="true">${icone}</span>` : ''}</button>`;
  }).join('');
  ecran.innerHTML = `${T.reprise ? '<p class="bandeau-reprise">Reprise des questions manquées : mêmes notions, autres valeurs.</p>' : ''}
    <article class="carte" aria-labelledby="titre-q">
      ${!UNE_PARTIE && !T.reprise ? `<p class="partie">${nomPartie(q.partie)}</p>` : ''}
      <p class="meta" id="titre-q">Question ${T.numero(k)}<span> · ${q.theme}${q.type === 'vf' ? ' · vrai ou faux' : ''}</span></p>
      <div class="enonce">${tex(q.enonce)}</div>
      <div class="options" role="radiogroup" aria-label="Réponses">${options}</div>
    </article>
    ${rep ? retourHTML(q, ordre, rep) : ''}`;
  const suite = derniere ? (T.reprise ? 'Voir le bilan' : 'Voir mon résultat') : 'Question suivante';
  barreBas(brouillonBouton(), rep ? { texte: suite, action: suivant } : { texte: 'Valider', action: valider, desactive: selection === null });
}

function retourHTML(q, ordre, rep) {
  const bonne = q.type === 'vf' ? (q.bonne ? 'Vrai' : 'Faux') : lettreDe(q, ordre, q.bonne).toUpperCase();
  return `<section class="retour-corr ${rep.ok ? 'juste' : 'faux'}">
    <p class="verdict">${rep.ok ? 'Correct.' : 'Non. La bonne réponse est ' + bonne + '.'}</p>
    <div class="explication">${explicationHTML(q)}</div>
    ${!rep.ok && q.revoir ? `<p class="revoir">À revoir : ${tex(q.revoir)}.</p>` : ''}
  </section>`;
}

ecran.addEventListener('click', e => {
  const o = e.target.closest('.option');
  if (!o || o.disabled || MODE_CORRIGE) return;
  const T = tourCourant();
  selection = lireValeur(T.question(T.etat.courant), o.dataset.val);
  ecran.querySelectorAll('.option').forEach(b => b.setAttribute('aria-checked', b === o ? 'true' : 'false'));
  btnP.disabled = false;
});

function valider() {
  const T = tourCourant(), k = T.etat.courant, q = T.question(k);
  if (selection === null || T.etat.reponses[k]) return;
  T.etat.reponses[k] = { choix: selection, ok: selection === q.bonne };
  selection = null;
  sauver();
  rendre();
  const c = $('.retour-corr');
  if (c) c.scrollIntoView({ block: 'nearest', behavior: motion() });
}

// La prochaine question sans réponse (après celle-ci, sinon depuis le début) ; toutes faites : le résultat.
function prochaine(T) {
  const reps = T.etat.reponses, k0 = T.etat.courant;
  for (let k = k0 + 1; k < T.total; k++) if (!reps[k]) return k;
  for (let k = 0; k < k0; k++) if (!reps[k]) return k;
  return T.total;
}
function suivant() {
  const T = tourCourant();
  T.etat.courant = prochaine(T);
  selection = null;
  sauver();
  rendre();
  window.scrollTo(0, 0);
}

function ligneRecap(q, ordre, rep, numero) {
  const bonne = 'Bonne réponse&nbsp;: ' + reponseTexte(q, ordre, q.bonne);
  const texte = !rep ? 'Sans réponse. ' + bonne : rep.ok ? 'Ta réponse&nbsp;: ' + reponseTexte(q, ordre, rep.choix) + '. Correct.'
    : 'Ta réponse&nbsp;: ' + reponseTexte(q, ordre, rep.choix) + '.<br>' + bonne + '.';
  return `<li class="${!rep ? 'vide' : rep.ok ? 'juste' : 'faux'}"><details>
    <summary><span class="num">${numero}</span><span class="theme">${q.theme}</span><span class="icone" role="img" aria-label="${!rep ? 'sans réponse' : rep.ok ? 'juste' : 'fausse'}">${!rep ? '–' : rep.ok ? '✓' : '✗'}</span></summary>
    <div class="detail"><div class="enonce">${tex(q.enonce)}</div><p class="ta-rep">${texte}</p><div class="explication">${explicationHTML(q)}</div></div>
  </details></li>`;
}

function rendreResultat() {
  if (brouillonOuvert) basculerBrouillon();
  const score = etat.reponses.filter(estJuste).length, R = etat.reprise, nm = manquees().length, aRevoir = listeARevoir();
  const parties = UNE_PARTIE ? '' : `<p class="bilan-parties">${QUIZ.parties.map((nom, p) => {
    const rg = questionsDe(p);
    return `${nomPartie(p)}&nbsp;: <b>${rg.filter(i => estJuste(etat.reponses[i])).length} / ${rg.length}</b>`;
  }).join('<br>')}</p>`;
  ecran.innerHTML = `<section class="carte" aria-labelledby="titre-res">
      <p class="meta" id="titre-res">Résultat</p>
      <p class="score"><b>${score}</b> / ${N}</p>
      ${N === 20 ? '' : `<p class="sur20">soit ${noteSur20(score, N)} sur 20</p>`}
      <p class="appreciation">${appreciation(score, N)}</p>
      ${parties}
      ${R ? `<p class="bilan-reprise">Reprise des questions manquées&nbsp;: <b>${R.reponses.filter(estJuste).length} / ${R.rangs.length}</b></p>` : ''}
    </section>
    ${aRevoir.length ? `<section class="carte"><p class="meta">À revoir avant l'évaluation</p><ul class="a-revoir">${aRevoir.map(t => `<li>${tex(t)}</li>`).join('')}</ul></section>` : ''}
    <h2 class="titre-liste">Tes réponses</h2>
    <ol class="recap">${QUIZ.questions.map((q, i) => ligneRecap(q, etat.ordre[i], etat.reponses[i], i + 1)).join('')}</ol>
    ${R ? `<h2 class="titre-liste">Reprise</h2><ol class="recap">${R.rangs.map((i, k) => ligneRecap(variante(i), R.ordre[k], R.reponses[k], i + 1)).join('')}</ol>` : ''}`;
  const recommencerBtn = { texte: 'Recommencer', action: b => confirmer(b, 'Confirmer', recommencer) };
  if (nm) barreBas(recommencerBtn, { texte: R ? 'Refaire la reprise' : `Refaire les manquées (${nm})`, action: () => reprendre(manquees()) });
  else barreBas(null, { texte: 'Recommencer', action: b => confirmer(b, 'Confirmer : tout effacer', recommencer) });
}

function reprendre(rangs) {
  etat.reprise = nouvelleReprise(rangs);
  selection = null;
  sauver();
  rendre();
  window.scrollTo(0, 0);
}

function recommencer() {
  etat = nouvelEtat();
  selection = null;
  introFaite = true;
  sauver();
  rendre();
  window.scrollTo(0, 0);
}

function rendreCorrige() {
  intro.hidden = true;
  segments.hidden = true;
  $('.bas').hidden = true;
  compteur.textContent = 'Corrigé';
  const carte = (q, numero, titre) => {
    const ordre = q.type === 'qcm' ? q.choix.map((_, k) => k) : null;
    const options = valeursDe(q, ordre).map(val => `<button type="button" class="option ${val === q.bonne ? 'juste' : 'terne'}" disabled>`
      + `<span class="pastille">${q.type === 'vf' ? (val ? 'V' : 'F') : lettreDe(q, ordre, val).toUpperCase()}</span>`
      + `<span class="texte">${q.type === 'vf' ? (val ? 'Vrai' : 'Faux') : tex(q.choix[val])}</span></button>`).join('');
    return `<article class="carte"><p class="meta">${titre} ${numero}<span> · ${q.theme}</span></p><div class="enonce">${tex(q.enonce)}</div>
      <div class="options">${options}</div><div class="explication" style="margin-top:14px">${explicationHTML(q)}</div></article>`;
  };
  ecran.innerHTML = QUIZ.questions.map((q, i) => carte(q, i + 1, 'Question') + (q.variante ? carte(variante(i), i + 1, 'Variante de la question') : '')).join('');
}

/* ---------- Brouillon : on écrit au doigt (ou à la souris) sur des petits carreaux ; deux doigts
   déplacent la feuille et zooment (sur ordinateur : molette, pavé tactile) ---------- */
const brouillon = $('#brouillon'), toile = $('#toile'), ctx = toile.getContext('2d');
const btnRecentrer = $('#recentrer');
const CARREAU = 19, ZOOM_MIN = 0.5, ZOOM_MAX = 4;
let brouillonOuvert = false, outil = 'crayon';
// Traits en coordonnées de la feuille (pixels CSS au zoom 1), redessinés nets à chaque déplacement
// ou zoom : { gomme, largeur, points: [x0, y0, x1, y1, ...], boite: [xmin, ymin, xmax, ymax] }.
// Le stylo garde son épaisseur sur la feuille ; la gomme, sa taille sous le doigt, à tout zoom.
let traits = [];
// Vue : point de la feuille au coin haut gauche de la toile (x, y) et zoom z ; écran = (feuille − coin) × z.
// La feuille commence en (0, 0) : on ne va ni au-dessus ni à gauche.
const vue = { x: 0, y: 0, z: 1 };
let rapport = 1;           // pixels de la toile par pixel CSS (écrans haute définition)
const doigts = new Map();  // doigts posés sur la toile : identifiant -> position à l'écran
let enCours = null;        // trait en train d'être tracé : { trait, id, t0, chemin, dernier }
let geste = null;          // deux doigts : { a, b, pa, pb, vue } quand le second s'est posé
function basculerBrouillon() {
  brouillonOuvert = !brouillonOuvert;
  brouillon.hidden = !brouillonOuvert;
  document.body.classList.toggle('avec-brouillon', brouillonOuvert);
  btnG.setAttribute('aria-pressed', brouillonOuvert ? 'true' : 'false');
  doigts.clear(); enCours = geste = null;
  if (brouillonOuvert) ajusterToile();
}
// La toile suit la taille de son cadre (rotation du téléphone) et se redessine.
function ajusterToile() {
  const cadre = toile.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const l = Math.round(cadre.width * dpr), h = Math.round(cadre.height * dpr);
  if (!l || !h || (toile.width === l && toile.height === h)) return;
  toile.width = l; toile.height = h;
  rapport = l / cadre.width;
  redessiner();
}
const poserVue = () => { const k = vue.z * rapport; ctx.setTransform(k, 0, 0, k, -vue.x * k, -vue.y * k); };
// Le trait t, depuis son point de rang debut (un simple appui laisse un point).
function tracer(t, debut) {
  const p = t.points;
  ctx.globalCompositeOperation = t.gomme ? 'destination-out' : 'source-over';
  ctx.strokeStyle = '#1E3D96';
  ctx.lineWidth = t.largeur;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(p[debut], p[debut + 1]);
  if (p.length === 2) ctx.lineTo(p[0] + 0.01, p[1]);
  for (let i = debut + 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
  ctx.stroke();
}
// Carreaux glissés sous l'encre : ils restent visibles là où l'on gomme (le fond blanc est celui de la toile).
function carreaux() {
  const k = vue.z * rapport, e = Math.max(1, Math.round(rapport));
  const ligne = (i, o) => Math.round((i * CARREAU - o) * k);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'destination-over';
  ctx.fillStyle = '#D5E2F2';
  for (let i = Math.floor(vue.x / CARREAU); ligne(i, vue.x) < toile.width; i++) ctx.fillRect(ligne(i, vue.x), 0, e, toile.height);
  for (let i = Math.floor(vue.y / CARREAU); ligne(i, vue.y) < toile.height; i++) ctx.fillRect(0, ligne(i, vue.y), toile.width, e);
}
function redessiner() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, toile.width, toile.height);
  poserVue();
  const x2 = vue.x + toile.width / (vue.z * rapport), y2 = vue.y + toile.height / (vue.z * rapport);
  traits.forEach(t => {   // seulement les traits visibles
    const b = t.boite, m = t.largeur;
    if (b[0] - m < x2 && b[2] + m > vue.x && b[1] - m < y2 && b[3] + m > vue.y) tracer(t, 0);
  });
  carreaux();
}
let dessinPrevu = false;
function demanderDessin() {
  if (dessinPrevu) return;
  dessinPrevu = true;
  requestAnimationFrame(() => { dessinPrevu = false; redessiner(); });
}
// Nouvelle vue, redessinée à la prochaine image ; Recentrer ramène au début de la feuille, zoom 1.
function placerVue(x, y, z) {
  if (!isFinite(x + y + z)) return;
  vue.x = Math.max(0, x); vue.y = Math.max(0, y); vue.z = z;
  btnRecentrer.hidden = vue.x < 1 && vue.y < 1 && Math.abs(vue.z - 1) < 0.01;
  demanderDessin();
}
// Zoom de facteur f autour du point p de l'écran, qui reste en place.
function zoomer(f, p) {
  const z = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, vue.z * f));
  placerVue(vue.x + p.x / vue.z - p.x / z, vue.y + p.y / vue.z - p.y / z, z);
}
const surEcran = (e, c) => ({ x: e.clientX - c.left, y: e.clientY - c.top });

function commencerTrait(id, p) {
  const x = vue.x + p.x / vue.z, y = vue.y + p.y / vue.z, gomme = outil === 'gomme';
  const t = { gomme: gomme, largeur: gomme ? 24 / vue.z : 2.4, points: [x, y], boite: [x, y, x, y] };
  traits.push(t);
  enCours = { trait: t, id: id, t0: performance.now(), chemin: 0, dernier: p };
  poserVue(); tracer(t, 0);
  if (gomme) carreaux();
}
function prolonger(p) {   // p : position à l'écran ; moins d'un pixel parcouru, rien à tracer
  const c = enCours, d = Math.hypot(p.x - c.dernier.x, p.y - c.dernier.y);
  if (d < 1) return;
  const t = c.trait, b = t.boite, x = vue.x + p.x / vue.z, y = vue.y + p.y / vue.z;
  c.chemin += d; c.dernier = p;
  t.points.push(x, y);
  b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y);
  tracer(t, t.points.length - 4);
}
// Trait terminé : allégé des points inutiles (Douglas-Peucker, à un tiers de pixel près à l'écran),
// pour redessiner vite quand on déplace ou zoome.
function finirTrait() {
  const p = enCours.trait.points, n = p.length / 2, tol = 0.3 / vue.z, garder = new Uint8Array(n), pile = [0, n - 1];
  enCours = null;
  if (n < 3) return;

    let loin = -1, dmax = tol;

      const ux = p[2 * i] - ax, uy = p[2 * i + 1] - ay, s = L2 ? Math.max(0, Math.min(1, (ux * dx + uy * dy) / L2)) : 0;

// Deux doigts : le trait que le premier venait de commencer était le début du geste, il est retiré.
function commencerGeste() {

    else finirTrait();

  const [a, b] = doigts.keys();

function suivreGeste() {

toile.addEventListener('pointerdown', e => {
